
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = btt_octopus_pro_v1_0_f446ze_literal_upstream

[env:btt_octopus_pro_v1_0_f446ze_literal_upstream]
platform = ststm32@19.6.0
board = genericSTM32F446ZE
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_src_filter =
   -<*>
   +<main.cpp>
   +<motor_init.cpp>
   +<structs.cpp>
   +<utils.cpp>
   +<octopus_board.cpp>
   +<octopus_can_stub.cpp>
   +<octopus_clock.cpp>
build_flags =
   -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
   -D USBCON
   -D USBD_VID=0x0483
   -D USBD_PID=0x5740
   -D USB_MANUFACTURER_STRING=\"PAROL6_OCTOPUS_EXP22\"
   -D HSE_VALUE=12000000U
   -D PAROL6_OCTOPUS_LITERAL_PORT=1
monitor_speed = 3000000
